name: SuperMines
main: io.github.lijinhong11.supermines.SuperMines
version: ${version}
authors: ["mmmjjkx"]
description: A mine plugin
api-version: "26.1"
folia-supported: true
website: https://github.com/LinsMinecraftStudio/SuperMines
depend:
  - MittelLib
softdepend:
  - ItemsAdder
  - Nexo
  - Oraxen
  - WorldEdit
  - FastAsyncWorldEdit
  - PlaceholderAPI
  - MiniPlaceholders
  - mcMMO
  - AuraSkills
permissions:
  supermines.migrate:
    description: Import mines from CataMines or MineResetLite data files
    default: op
  supermines.set_reset_message_broadcast:
    description: Change a mine's reset and warning message broadcast mode
    default: op
