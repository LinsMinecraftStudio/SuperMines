# The default language
language: en-US

# Whether to use the corresponding language that player uses
detect-player-locale: true

# Update check
check-update: true

# Mine settings
mine:
  # Allow place blocks in mines
  allow-place: false
  # Allow to players earn XP from skill plugins in mines
  # Note: support mcMMO and AuraSkills
  allow-earn-xp: true
  # Default MessageBroadcastMode for new mines and mines without an explicit setting.
  # ALL: all players; IN_WORLD: players in the mine's world;
  # IN_MINE: only players inside the mine; SILENT: no reset/warning messages.
  # Per-mine values can be changed with /sm setBroadcastResetMessages or in the mine GUI.
  broadcast-reset-messages: ALL
  # Auto pickup settings
  auto-pickup:
    # Whether to enable auto pickup
    # You can use "/mine auto-pickup-toggle" to toggle the state
    enabled: false
    # Player who has this permission can use the feature
    # Set to empty to let all players can use
    permission: ""
    # Whether to enable the feature to the player automatically
    auto-enable: false

# Regen point settings
# Regen points are single regenerable ore blocks, independent of mines
regen-point:
  # Allow place blocks on a regen point location
  # When false, only operators can place blocks on regen point locations
  allow-place: false
  # Whether to show particles when a regen point respawns
  particles: true
  # The particle shown when a regen point respawns
  particle: HAPPY_VILLAGER
  # Whether to play a sound when a regen point respawns
  sound: true
  # The sound played when a regen point respawns
  sound-name: minecraft:block.note_block.pling
  # Delay before retrying when another plugin cancels a scheduled respawn event
  cancelled-respawn-retry-seconds: 5
  protection:
    # Prevent explosions from destroying regen point blocks
    explosions: true
    # Prevent pistons from moving blocks into or out of regen point locations
    pistons: true
    # Prevent fluids from flowing into regen point locations
    fluids: true
    # Prevent physics, burning, fading, falling blocks, and entity transformations
    environmental: true

# Storage settings
# Require restart
storage:
  # Database type
  # Support: SQLite, MySQL, MariaDB, PostgreSQL
  type: sqlite
  remote:
    host: localhost
    port: 3306
    database: supermines
    username: root
    password: PASSWORD
